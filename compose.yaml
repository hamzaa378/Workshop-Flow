# Optional local MySQL 8 instance (app/services run natively on the host).
services:
  mysql:
    image: mysql:8.4
    container_name: gdg-workshops-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      MYSQL_DATABASE: gdg_workshops
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - gdg_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 4s
      retries: 20
volumes:
  gdg_mysql_data:
